5 7h2a5 5 0 1 1 0 10h-2\"><\u002Fpath><line x1=\"8\" x2=\"16\" y1=\"12\" y2=\"12\"><\u002Fline><\u002Fsvg><span>Link<\u002Fspan><\u002Fdiv>\n        <div class=\"dock-btn\"><svg class=\"i\" viewBox=\"0 0 24 24\"><line x1=\"22\" x2=\"2\" y1=\"6\" y2=\"6\"><\u002Fline><line x1=\"22\" x2=\"2\" y1=\"18\" y2=\"18\"><\u002Fline><line x1=\"6\" x2=\"6\" y1=\"2\" y2=\"22\"><\u002Fline><line x1=\"18\" x2=\"18\" y1=\"2\" y2=\"22\"><\u002Fline><\u002Fsvg><span>Frame<\u002Fspan><\u002Fdiv>\n        <div class=\"dock-btn\"><svg class=\"i\" viewBox=\"0 0 24 24\"><circle cx=\"19\" cy=\"5\" r=\"2\"><\u002Fcircle><circle cx=\"5\" cy=\"19\" r=\"2\"><\u002Fcircle><path d=\"M5 17A12 12 0 0 1 17 5\"><\u002Fpath><\u002Fsvg><span>Connect<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"glass glass-control zoom mock\" aria-hidden=\"true\">\n        <span class=\"ghost\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <span class=\"zoom-level num\">100%<\u002Fspan>\n        <span class=\"ghost\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"M12 5v14\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <span class=\"ghost\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M3 7V5a2 2 0 0 1 2-2h2\"><\u002Fpath><path d=\"M17 3h2a2 2 0 0 1 2 2v2\"><\u002Fpath><path d=\"M21 17v2a2 2 0 0 1-2 2h-2\"><\u002Fpath><path d=\"M7 21H5a2 2 0 0 1-2-2v-2\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Ffooter>\n\n  <\u002Fmain>\n<\u002Fdiv>\n<\u002Fsc-if><\u002Fx-dc>\n\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;windowsUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://github.com/ErmendQ/lumen-releases/releases/latest/download/Lumgraph-Windows-Setup.exe&quot;,&quot;section&quot;:&quot;Downloads&quot;},&quot;macUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://github.com/ErmendQ/lumen-releases/releases/latest/download/Lumgraph-Mac.dmg&quot;,&quot;section&quot;:&quot;Downloads&quot;},&quot;secondsPerColor&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:28,&quot;min&quot;:8,&quot;max&quot;:90,&quot;step&quot;:1,&quot;unit&quot;:&quot;s&quot;,&quot;section&quot;:&quot;Accent&quot;},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    // Only the visitor's own system gets the highlight and pulse. Phones and other systems get neither.\n    const platform = navigator.platform || navigator.userAgent;\n    const touch = navigator.maxTouchPoints > 1;\n    const mac = /Mac/i.test(platform) ? !touch : false;\n    this.setState({ os: mac ? 'mac' : /Win/i.test(platform) ? 'windows' : null, page: 'landing' });\n    this.loadVersion();\n\n    // Starts on the app's Abyss accent (#3fd0b6), then wanders.\n    this.from = { l: 0.775, c: 0.127, h: 178.1 };\n    this.to = this.nextColor(this.from);\n    this.legTime = 0;\n    this.legLength = this.nextLength();\n    this.lastTick = performance.now();\n\n    // A few small steps a second is too fine to see at this speed, and keeps the page light.\n    this.timer = setInterval(() => this.tick(), 160);\n  }\n\n  // The newest version out for both Windows and Mac, read from the public releases.\n  loadVersion() {\n    fetch('https://api.github.com/repos/ErmendQ/lumen-releases/releases?per_page=20')\n      .then((r) => (r.ok ? r.json() : []))\n      .then((releases) => {\n        const seen = { windows: new Set(), mac: new Set() };\n        releases.forEach((r) => {\n          const m = /^(windows|mac)-v(\\d+)\\.(\\d+)\\.(\\d+)$/.exec(r.tag_name || '');\n          if (m && !r.draft && !r.prerelease) seen[m[1]].add(m[2] + '.' + m[3] + '.' + m[4]);\n        });\n        const key = (v) => v.split('.').reduce((n, part) => n * 1000 + Number(part), 0);\n        const both = [...seen.windows].filter((v) => seen.mac.has(v)).sort((a, b) => key(b) - key(a));\n        if (both.length) this.setState({ version: both[0] });\n      })\n      .catch(() => {});\n  }\n\n  show(page) {\n    if (this.state && this.state.page === page) return;\n    this.setState({ page });\n    // On phones the project list sits below the page: go back up to what just opened.\n    if (window.innerWidth <= 1000) window.scrollTo({ top: 0, behavior: 'smooth' });\n  }\n\n  // Scales the App introduction canvas to fit its space: the whole canvas always shows.\n  fitIntro(root) {\n    const box = root.querySelector('.intro-fit');\n    const canvas = root.querySelector('.intro-canvas');\n    if (!box || !canvas || !canvas.offsetWidth) return;\n    const narrow = window.innerWidth <= 1000;\n    const w = canvas.offsetWidth;\n    const h = canvas.offsetHeight;\n    const k = Math.min(box.clientWidth / w, narrow ? 1 : box.clientHeight / h, 1.6);\n    const height = narrow ? Math.ceil(h * k) + 'px' : '';\n    canvas.style.setProperty('--fit', k.toFixed(4));\n    if (box.style.height !== height) box.style.height = height;\n  }\n\n  componentWillUnmount() {\n    clearInterval(this.timer);\n    if (this.unwire) this.unwire();\n  }\n\n  // One arrow, stopping short of the glass like the app's: a curved line plus a solid head. It leaves\n  // (x1, y1) heading along `from` and arrives at (x2, y2) heading along `to`.\n  setArrow(root, name, x1, y1, x2, y2, from, to) {\n    const line = root.querySelector('.' + name);\n    const head = root.querySelector('.' + name + '-head');\n    if (!line) return;\n    if (!head) return;\n    const unit = (v) => {\n      const length = Math.hypot(v[0], v[1]) || 1;\n      return [v[0] / length, v[1] / length];\n    };\n    const [sx, sy] = unit(from);\n    const [ux, uy] = unit(to);\n    const bx = x2 - ux * 10.8;\n    const by = y2 - uy * 10.8;\n    const reach = Math.hypot(bx - x1, by - y1) * 0.45;\n    const nx = -uy * 4.8;\n    const ny = ux * 4.8;\n    const n = (v) => v.toFixed(1);\n    line.setAttribute('d', 'M' + n(x1) + ' ' + n(y1) + ' C' + n(x1 + sx * reach) + ' ' + n(y1 + sy * reach) + ' ' + n(bx - ux * reach) + ' ' + n(by - uy * reach) + ' ' + n(bx) + ' ' + n(by));\n    head.setAttribute('d', 'M' + n(x2) + ' ' + n(y2) + ' L' + n(bx + nx) + ' ' + n(by + ny) + ' L' + n(bx - nx) + ' ' + n(by - ny) + ' Z');\n  }\n\n  drawLinks(root) {\n    const desk = root.querySelector('.desk');\n    const note = root.querySelector('.note-widget');\n    const list = root.querySelector('.list-widget');\n    const files = root.querySelector('.apps');\n    if (!desk) return;\n    if (!note) return;\n    if (!list) return;\n    if (!files) return;\n    if (!note.offsetWidth) return; // another project is open\n    const d = desk.getBoundingClientRect();\n    const k = desk.offsetWidth / (d.width || 1);\n    const box = (el) => {\n      const r = el.getBoundingClientRect();\n      return { l: (r.left - d.left) * k, t: (r.top - d.top) * k, r: (r.right - d.left) * k, b: (r.bottom - d.top) * k };\n    };\n    const a = box(note);\n    const b = box(list);\n    const c = box(files);\n    // Note to checklist: a low arc over the gap between them.\n    this.setArrow(root, 'link-one', a.r + 10, a.t + (a.b - a.t) * 0.38, b.l - 10, b.t + (b.b - b.t) * 0.34, [1, -0.38], [1, 0.38]);\n    // Checklist to files: down past the title, into the side of the files (or onto their top when there's no room).\n    // It runs down beside the title, never through it.\n    const title = root.querySelector('.landing h1');\n    const t = title ? box(title) : null;\n    const sx = Math.min(b.r - 24, Math.max(b.l + (b.r - b.l) * 0.5, t ? t.r + 28 : 0));\n    if (sx - c.r > 34) this.setArrow(root, 'link-two', sx, b.b + 10, c.r + 10, c.t + (c.b - c.t) * 0.42, [0, 1], [-1, 0]);\n    else this.setArrow(root, 'link-two', sx, b.b + 10, Math.min(sx, c.r - 40), c.t - 10, [0, 1], [0, 1]);\n  }\n\n  // Cursor orb, arrows and the App introduction's fit.\n  wire(root) {\n    this.wired = true;\n    const orb = root.querySelector('.cursor-orb');\n    const ribbon = root.querySelector('.ribbon');\n    const pieces = ribbon ? Array.from(ribbon.querySelectorAll('path')) : [];\n    const trail = Array.from({ length: pieces.length + 1 }, () => ({ x: 0, y: 0 }));\n    const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    pieces.forEach((piece, i) => piece.setAttribute('fill-opacity', (0.34 * (1 - i / pieces.length)).toFixed(3)));\n    let px = 0, py = 0, ox = 0, oy = 0, seen = false, raf = 0, settle = 0;\n\n    // A short tapered ribbon: each point chases the one ahead of it, with a limit on how far it can fall behind.\n    const drawRibbon = () => {\n      if (still) return 0;\n      if (!pieces.length) return 0;\n      const last = trail.length - 1;\n      trail[0].x = ox;\n      trail[0].y = oy;\n      trail.forEach((point, i) => {\n        if (!i) return;\n        const ahead = trail[i - 1];\n        point.x += (ahead.x - point.x) * 0.45;\n        point.y += (ahead.y - point.y) * 0.45;\n        const gap = Math.hypot(point.x - ahead.x, point.y - ahead.y);\n        if (gap > 8) {\n          point.x = ahead.x + (point.x - ahead.x) * 8 / gap;\n          point.y = ahead.y + (point.y - ahead.y) * 8 / gap;\n        }\n      });\n      const edges = trail.map((point, i) => {\n        const a = trail[Math.max(i - 1, 0)];\n        const b = trail[Math.min(i + 1, last)];\n        const length = Math.hypot(b.x - a.x, b.y - a.y) || 1;\n        const width = 2.6 * (1 - i / last);\n        const nx = -(b.y - a.y) / length * width;\n        const ny = (b.x - a.x) / length * width;\n        return {\n          l: (point.x + nx).toFixed(1) + ' ' + (point.y + ny).toFixed(1),\n          r: (point.x - nx).toFixed(1) + ' ' + (point.y - ny).toFixed(1)\n        };\n      });\n      pieces.forEach((piece, i) => {\n        const a = edges[i];\n        const b = edges[i + 1];\n        piece.setAttribute('d', 'M' + a.l + ' L' + b.l + ' L' + b.r + ' L' + a.r + ' Z');\n      });\n      return Math.hypot(trail[last].x - ox, trail[last].y - oy);\n    };\n\n    const frame = () => {\n      raf = 0;\n      const ease = still ? 1 : 0.34;\n      ox += (px - ox) * ease;\n      oy += (py - oy) * ease;\n      if (orb) orb.style.transform = 'translate3d(' + (ox - 28).toFixed(1) + 'px,' + (oy - 28).toFixed(1) + 'px,0)';\n      const tail = drawRibbon();\n      settle -= 1;\n      if (settle > 0 || tail > 0.5 || Math.abs(px - ox) + Math.abs(py - oy) > 0.3) raf = requestAnimationFrame(frame);\n    };\n    const kick = () => {\n      settle = 12;\n      if (!raf) raf = requestAnimationFrame(frame);\n    };\n\n    const onMove = (e) => {\n      if (e.pointerType === 'touch') return;\n      px = e.clientX;\n      py = e.clientY;\n      if (!seen) {\n        seen = true;\n        ox = px;\n        oy = py;\n        trail.forEach((point) => {\n          point.x = px;\n          point.y = py;\n        });\n        if (orb) orb.classList.add('on');\n        if (ribbon) ribbon.classList.add('on');\n      }\n      kick();\n    };\n    const onLeave = () => {\n      seen = false;\n      if (orb) orb.classList.remove('on');\n      if (ribbon) ribbon.classList.remove('on');\n    };\n    const redraw = () => {\n      this.drawLinks(root);\n      this.fitIntro(root);\n    };\n\n    const page = document.documentElement;\n    window.addEventListener('pointermove', onMove, { passive: true });\n    page.addEventListener('pointerleave', onLeave);\n    window.addEventListener('resize', redraw);\n\n    // Next frame: fitting the introduction resizes what is watched, which must not happen inside the callback.\n    let pending = 0;\n    const watcher = new ResizeObserver(() => {\n      if (!pending) pending = requestAnimationFrame(() => {\n        pending = 0;\n        redraw();\n      });\n    });\n    ['.desk', '.note-widget', '.list-widget', '.apps', '.intro-fit', '.intro-canvas'].forEach((name) => {\n      const el = root.querySelector(name);\n      if (el) watcher.observe(el);\n    });\n    redraw();\n    if (document.fonts) document.fonts.ready.then(redraw);\n\n    this.unwire = () => {\n      window.removeEventListener('pointermove', onMove);\n        page.removeEventListener('pointerleave', onLeave);\n      window.removeEventListener('resize', redraw);\n      watcher.disconnect();\n      if (pending) cancelAnimationFrame(pending);\n      if (raf) cancelAnimationFrame(raf);\n    };\n  }\n\n  // Lightness and chroma stay in the range of the app's dark accents, so text stays readable at any hue.\n  nextColor(from) {\n    const turn = 50 + Math.random() * 110;\n    return {\n      l: 0.76 + Math.random() * 0.04,\n      c: 0.11 + Math.random() * 0.025,\n      h: from.h + (Math.random() > 0.5 ? turn : -turn)\n    };\n  }\n\n  nextLength() {\n    const seconds = this.props.secondsPerColor ?? 28;\n    return seconds * (0.7 + Math.random() * 0.6) * 1000;\n  }\n\n  tick() {\n    const now = performance.now();\n    const passed = Math.min(now - this.lastTick, 400);\n    this.lastTick = now;\n    if (document.hidden) return;\n\n    const root = this.root || document.querySelector('.lm');\n    if (!root) return;\n    if (!this.wired) this.wire(root);\n\n    this.legTime += passed;\n    if (this.legTime >= this.legLength) {\n      this.from = this.to;\n      this.to = this.nextColor(this.from);\n      this.legTime = 0;\n      this.legLength = this.nextLength();\n    }\n\n    const t = this.legTime / this.legLength;\n    const eased = t * t * t * (t * (t * 6 - 15) + 10);\n    const blend = (a, b) => a + (b - a) * eased;\n    const l = blend(this.from.l, this.to.l).toFixed(4);\n    const c = blend(this.from.c, this.to.c).toFixed(4);\n    const h = blend(this.from.h, this.to.h).toFixed(2);\n    const color = (turn) => 'oklch(' + l + ' ' + c + ' ' + (parseFloat(h) + turn).toFixed(2) + ')';\n    root.style.setProperty('--accent', color(0));\n\n    // Each orb sits a little to one side of the accent, so they differ slightly.\n    root.style.setProperty('--orb-a', color(28));\n    root.style.setProperty('--orb-b', color(-30));\n    root.style.setProperty('--orb-c', color(12));\n  }\n\n  renderVals() {\n    const os = this.state ? this.state.os : null;\n    const page = (this.state && this.state.page) || 'landing';\n    this.openLanding = this.openLanding || (() => this.show('landing'));\n    this.openIntro = this.openIntro || (() => this.show('intro'));\n    this.openReviews = this.openReviews || (() => this.show('reviews'));\n    this.setRoot = this.setRoot || ((el) => {\n      this.root = el;\n    });\n    return {\n      setRoot: this.setRoot,\n      page,\n      version: (this.state && this.state.version) || '0.3.1',\n      landingOn: page === 'landing' ? 'on' : '',\n      introOn: page === 'intro' ? 'on' : '',\n      reviewsOn: page === 'reviews' ? 'on' : '',\n      landingCurrent: page === 'landing' ? 'page' : undefined,\n      introCurrent: page === 'intro' ? 'page' : undefined,\n      reviewsCurrent: page === 'reviews' ? 'page' : undefined,\n      openLanding: this.openLanding,\n      openIntro: this.openIntro,\n      openReviews: this.openReviews,\n      windowsUrl: this.props.windowsUrl ?? 'https://github.com/ErmendQ/lumen-releases/releases/latest/download/Lumgraph-Windows-Setup.exe',\n      macUrl: this.props.macUrl ?? 'https://github.com/ErmendQ/lumen-releases/releases/latest/download/Lumgraph-Mac.dmg',\n      windowsTone: os === 'windows' ? 'primary' : 'soft',\n      macTone: os === 'mac' ? 'primary' : 'soft'\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
